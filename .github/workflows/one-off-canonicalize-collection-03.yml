name: One-off canonicalize collection 03

on:
  push:
    branches:
      - content/collection-03-porters-stouts-encyclopedia

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-collection-03]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: content/collection-03-porters-stouts-encyclopedia
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build canonical collection 03
        run: node scripts/one-off-canonicalize-collection-03.mjs

      - name: Remove one-off migration tooling
        run: |
          rm -f scripts/one-off-canonicalize-collection-03.mjs
          rm -f .github/workflows/one-off-canonicalize-collection-03.yml

      - name: Commit canonical collection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: canonicalise et enrichit les Porters et Stouts [canonical-collection-03]"
          git push origin HEAD:content/collection-03-porters-stouts-encyclopedia
