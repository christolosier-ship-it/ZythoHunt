name: One-shot regenerate C10 thumbnails

on:
  push:
    branches:
      - feature/secret-bizarre-insolite-c10

permissions:
  contents: write

jobs:
  regenerate-c10-thumbnails:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/secret-bizarre-insolite-c10

      - name: Install asset tooling
        run: python -m pip install -r scripts/requirements-assets.txt

      - name: Regenerate deterministic thumbnails
        run: python scripts/generate-thumbnails.py

      - name: Commit C10 thumbnails
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/collections/bizarre-et-insolite/thumb
          if git diff --cached --quiet; then
            echo "C10 thumbnails already deterministic."
            exit 0
          fi
          git commit -m "Fix C10 carousel thumbnails"
          git push origin HEAD:feature/secret-bizarre-insolite-c10
