name: Validate and deploy ZythoHunt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonicalize-collection-08:
    if: github.event_name == 'pull_request' && github.head_ref == 'content/collection-08-singular-historical-hybrid-encyclopedia'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: content/collection-08-singular-historical-hybrid-encyclopedia
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate canonical collection 08
        run: node scripts/one-off-canonicalize-collection-08.mjs

      - name: Restore normal CI and commit final cleanup
        run: |
          git show origin/main:.github/workflows/pages.yml > .github/workflows/pages.yml
          rm -f scripts/trigger-collection-08.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: canonicalise et enrichit les styles singuliers historiques et hybrides [canonical-collection-08]"
          git push origin HEAD:content/collection-08-singular-historical-hybrid-encyclopedia

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install asset tooling
        run: python -m pip install -r scripts/requirements-assets.txt

      - name: Generate normalized carousel thumbnails
        run: python scripts/generate-thumbnails.py

      - name: Verify deterministic carousel thumbnails
        run: python scripts/generate-thumbnails.py --check

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck JavaScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build GitHub Pages artifact
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
