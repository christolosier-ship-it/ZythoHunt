name: Check C10 asset fingerprints

on:
  push:
    branches:
      - fix/c10-face-back-assets

permissions:
  contents: write

jobs:
  fingerprint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/c10-face-back-assets
      - run: python -m pip install Pillow==11.3.0 numpy
      - name: Write dimensions and dHash
        run: |
          mkdir -p .staging
          python - <<'PY' > .staging/fingerprints.txt
          from pathlib import Path
          from PIL import Image
          import numpy as np

          root = Path('public/assets/collections/bizarre-et-insolite')
          for name in ('face-bizarre-insolite.webp', 'dos-bizarre-insolite.webp'):
              path = root / name
              with Image.open(path) as image:
                  gray = image.convert('L').resize((17, 16))
                  a = np.array(gray)
                  bits = (a[:, 1:] > a[:, :-1]).flatten()
                  h = ''.join(f'{int("".join("1" if x else "0" for x in bits[i:i+4]), 2):x}' for i in range(0, len(bits), 4))
                  print(f'{name}: size={image.size} mode={image.mode} dhash={h}')
          PY
      - name: Commit fingerprint report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .staging/fingerprints.txt
          git commit -m "chore: record C10 asset fingerprints"
          git push origin HEAD:fix/c10-face-back-assets
