name: Canonicalize collection 10

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  canonicalize-collection-10:
    if: github.head_ref == 'content/collection-10-bizarre-encyclopedia'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: content/collection-10-bizarre-encyclopedia
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build canonical collection and clean authoring files
        run: |
          if [ ! -f scripts/one-off-canonicalize-collection-10.mjs ]; then
            echo "Collection 10 is already canonicalized."
            exit 0
          fi
          node scripts/one-off-canonicalize-collection-10.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: canonicalise les 42 curiosités de la collection 10"
          git push origin HEAD:content/collection-10-bizarre-encyclopedia
