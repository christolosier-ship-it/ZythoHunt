name: Validate and deploy ZythoHunt

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-thumbnails:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install asset tooling
        run: python -m pip install -r scripts/requirements-assets.txt

      - name: Generate normalized carousel thumbnails
        run: python scripts/generate-thumbnails.py

      - name: Commit normalized thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/collections/*/thumb/*.webp
          if git diff --cached --quiet; then
            echo "All carousel thumbnails are already normalized."
          else
            git commit -m "build(assets): normalize all carousel thumbnails"
            git push origin HEAD:${{ github.head_ref }}
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install asset tooling
        run: python -m pip install -r scripts/requirements-assets.txt

      - name: Generate normalized carousel thumbnails
        run: python scripts/generate-thumbnails.py

      - name: Verify deterministic carousel thumbnails
        run: python scripts/generate-thumbnails.py --check

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck JavaScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build GitHub Pages artifact
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
