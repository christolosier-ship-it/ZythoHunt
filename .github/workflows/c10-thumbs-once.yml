name: C10 thumbs once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'fix/c10-thumbs-final'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/c10-thumbs-final
          persist-credentials: true
      - name: Install asset tooling
        run: python -m pip install -r scripts/requirements-assets.txt
      - name: Generate thumbnails
        run: |
          python scripts/generate-thumbnails.py
          python scripts/generate-thumbnails.py --check
      - name: Commit only C10 thumbs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/assets/collections/bizarre-et-insolite/thumb/face-bizarre-insolite.webp \
            public/assets/collections/bizarre-et-insolite/thumb/dos-bizarre-insolite.webp
          if git diff --cached --quiet; then
            echo 'C10 thumbs already current.'
            exit 0
          fi
          git commit -m 'fix: regenerate C10 thumbnails'
          git push origin HEAD:fix/c10-thumbs-final
