name: C10 thumbs once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-c10-thumbs:
    if: github.head_ref == 'tmp/c10-thumbs-once'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install asset tooling
        run: python -m pip install -r scripts/requirements-assets.txt

      - name: Generate thumbnails
        run: python scripts/generate-thumbnails.py

      - name: Commit only C10 thumbnails
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/assets/collections/bizarre-et-insolite/thumb/face-bizarre-insolite.webp \
            public/assets/collections/bizarre-et-insolite/thumb/dos-bizarre-insolite.webp
          git diff --cached --name-only
          git commit -m 'chore: regenerate C10 carousel thumbnails'
          git push origin HEAD:tmp/c10-thumbs-once
