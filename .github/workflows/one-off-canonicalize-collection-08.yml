name: One-off canonicalize collection 08

on:
  push:
    branches:
      - content/collection-08-singular-historical-hybrid-encyclopedia

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-collection-08]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/collection-08-singular-historical-hybrid-encyclopedia
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Canonicalize collection 08
        run: node scripts/one-off-canonicalize-collection-08.mjs
      - name: Commit canonical collection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: canonicalise et enrichit les styles singuliers historiques et hybrides [canonical-collection-08]"
          git push origin HEAD:content/collection-08-singular-historical-hybrid-encyclopedia
