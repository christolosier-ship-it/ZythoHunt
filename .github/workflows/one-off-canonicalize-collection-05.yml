name: One-off canonicalize collection 05

on:
  push:
    branches:
      - content/collection-05-wheat-rye-encyclopedia

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-collection-05]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: content/collection-05-wheat-rye-encyclopedia
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate canonical collection 05
        run: node scripts/one-off-canonicalize-collection-05.mjs

      - name: Commit canonical collection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: canonicalise et enrichit les bières de blé et de seigle [canonical-collection-05]"
          git push origin HEAD:content/collection-05-wheat-rye-encyclopedia
