name: One-shot fix C10 card assets

on:
  push:
    branches:
      - feature/secret-bizarre-insolite-c10

permissions:
  contents: write

jobs:
  normalize-c10-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/secret-bizarre-insolite-c10

      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0

      - name: Normalize full-size assets and regenerate thumbnails
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('public/assets/collections/bizarre-et-insolite')
          names = ('dos-bizarre-insolite.webp', 'face-bizarre-insolite.webp')

          for name in names:
              source = root / name
              thumb = root / 'thumb' / name

              with Image.open(source) as image:
                  normalized = image.convert('RGBA').resize((1060, 1484), Image.Resampling.LANCZOS)
                  normalized.save(source, 'WEBP', quality=95, method=6, exact=True)

                  thumbnail = normalized.resize((360, 504), Image.Resampling.LANCZOS)
                  thumb.parent.mkdir(parents=True, exist_ok=True)
                  thumbnail.save(thumb, 'WEBP', quality=75, method=6, exact=True)

              with Image.open(source) as check:
                  assert check.size == (1060, 1484), (name, check.size)
          PY

      - name: Commit normalized assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/assets/collections/bizarre-et-insolite/dos-bizarre-insolite.webp \
            public/assets/collections/bizarre-et-insolite/face-bizarre-insolite.webp \
            public/assets/collections/bizarre-et-insolite/thumb/dos-bizarre-insolite.webp \
            public/assets/collections/bizarre-et-insolite/thumb/face-bizarre-insolite.webp
          if git diff --cached --quiet; then
            echo "Assets already normalized."
            exit 0
          fi
          git commit -m "Fix C10 card asset dimensions"
          git push origin HEAD:feature/secret-bizarre-insolite-c10
