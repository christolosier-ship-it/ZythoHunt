name: One-off canonicalize collection 06

on:
  push:
    branches:
      - content/collection-06-sour-wild-spontaneous-encyclopedia

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: content/collection-06-sour-wild-spontaneous-encyclopedia
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Canonicalize collection 06
        run: node scripts/one-off-canonicalize-collection-06.mjs

      - name: Commit canonical collection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: canonicalise et enrichit les bières acides sauvages et spontanées [canonical-collection-06]"
          git push origin HEAD:content/collection-06-sour-wild-spontaneous-encyclopedia
