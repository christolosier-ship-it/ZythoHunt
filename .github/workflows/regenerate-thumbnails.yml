name: Regenerate normalized thumbnails

on:
  push:
    branches:
      - fix/carousel-thumbnails-reveal-back
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-thumbnails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/carousel-thumbnails-reveal-back

      - name: Install asset tooling
        run: python -m pip install -r scripts/requirements-assets.txt

      - name: Regenerate every carousel thumbnail
        run: python scripts/generate-thumbnails.py

      - name: Commit normalized thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/collections/*/thumb/*.webp
          if git diff --cached --quiet; then
            echo "All thumbnails are already normalized."
          else
            git commit -m "build(assets): normalize all carousel thumbnails"
            git push origin HEAD:fix/carousel-thumbnails-reveal-back
          fi
