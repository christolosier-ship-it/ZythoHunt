name: Release ZythoHunt

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zythohunt-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install asset tooling
        run: python -m pip install -r scripts/requirements-assets.txt

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify committed carousel thumbnails
        if: steps.existing.outputs.exists != 'true'
        run: pnpm assets:thumbs:check

      - name: Validate and build portable package
        if: steps.existing.outputs.exists != 'true'
        run: pnpm check
        env:
          BASE_PATH: ./

      - name: Install Chromium
        if: steps.existing.outputs.exists != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright and axe checks
        if: steps.existing.outputs.exists != 'true'
        run: pnpm test:e2e

      - name: Package application
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          ARCHIVE="ZythoHunt-v${VERSION}.zip"
          (cd dist && zip -qr "../${ARCHIVE}" .)
          sha256sum "$ARCHIVE" > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "ZythoHunt-v${VERSION}.zip" \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "ZythoHunt v${VERSION}" \
            --notes-file CHANGELOG.md \
            --latest
