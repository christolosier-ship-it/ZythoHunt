<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#120904"/>
  <meta name="description" content="ZythoHunt, PWA d'exploration brassicole : ZythoSphère, Brassopédie, dégustation et badges."/>
  <link rel="canonical" href="https://christolosier-ship-it.github.io/ZythoHunt/"/>

  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="ZythoHunt"/>
  <meta property="og:title" content="ZythoHunt"/>
  <meta property="og:description" content="Explore les styles de bière, enrichis ta Brassopédie et suis tes dégustations."/>
  <meta property="og:url" content="https://christolosier-ship-it.github.io/ZythoHunt/"/>
  <meta property="og:image" content="https://christolosier-ship-it.github.io/ZythoHunt/brand/generated/share-1200x630-v2.png"/>
  <meta property="og:image:secure_url" content="https://christolosier-ship-it.github.io/ZythoHunt/brand/generated/share-1200x630-v2.png"/>
  <meta property="og:image:type" content="image/png"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta property="og:image:alt" content="Logo officiel ZythoHunt"/>

  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="ZythoHunt"/>
  <meta name="twitter:description" content="Explore les styles de bière, enrichis ta Brassopédie et suis tes dégustations."/>
  <meta name="twitter:image" content="https://christolosier-ship-it.github.io/ZythoHunt/brand/generated/share-1200x630-v2.png"/>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'">
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
  <link rel="icon" href="%BASE_URL%brand/generated/icon-32-v2.png" sizes="32x32" type="image/png">
  <link rel="icon" href="%BASE_URL%brand/generated/icon-48-v2.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="%BASE_URL%brand/generated/apple-touch-icon-180-v2.png" sizes="180x180">
  <title>ZythoHunt</title>
</head>
<body>
  <div id="beer-background-root" aria-hidden="true"></div>
  <div id="loading-screen" aria-live="polite" aria-label="Chargement en cours">
    <div class="loading-inner">
      <div class="loading-logo">ZYTHOHUNT</div>
      <div class="loading-bar-track"><div class="loading-bar-fill" id="loading-bar"></div></div>
      <div class="loading-label">Chargement des cartes…</div>
    </div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="scene-glow" aria-hidden="true"></div>
  <div id="scene-overlay" aria-hidden="true"></div>

  <div id="app" role="main">
    <aside id="app-sidebar" class="app-sidebar" aria-label="Navigation principale">
      <div class="app-sidebar-brand">
        <span class="app-sidebar-title">ZYTHOHUNT</span>
        <span class="app-sidebar-subtitle">Exploration brassicole</span>
      </div>
      <nav class="app-sidebar-nav">
        <div class="app-sidebar-section" data-sidebar-section="zythosphere">
          <button type="button" class="app-sidebar-primary" data-menu-view="zythosphere" aria-expanded="false" aria-controls="sidebar-zythosphere-collections"><span>ZythoSphère</span><span class="app-sidebar-chevron" aria-hidden="true">›</span></button>
          <div id="sidebar-zythosphere-collections" class="app-sidebar-collections" data-sidebar-collections="zythosphere" hidden></div>
        </div>
        <div class="app-sidebar-section" data-sidebar-section="brassopedie">
          <button type="button" class="app-sidebar-primary" data-menu-view="brassopedie" aria-expanded="false" aria-controls="sidebar-brassopedie-collections"><span>Brassopédie</span><span class="app-sidebar-chevron" aria-hidden="true">›</span></button>
          <div id="sidebar-brassopedie-collections" class="app-sidebar-collections" data-sidebar-collections="brassopedie" hidden></div>
        </div>
        <button type="button" data-menu-view="degustation">Dégustation</button>
        <button type="button" data-menu-view="badge">Badges</button>
        <button type="button" data-menu-view="reglages">Réglages</button>
      </nav>
    </aside>

    <div id="app-shell-main">
      <header id="app-header">
        <form id="reveal-search-form" class="reveal-search-form">
          <label class="sr-only" for="reveal-search-input">Quel style de bière as-tu identifié ?</label>
          <div class="reveal-search-row"><input id="reveal-search-input" type="text" autocomplete="off" spellcheck="false"/><button id="reveal-search-submit" type="submit">Révéler</button></div>
          <p id="reveal-search-feedback" aria-live="polite"></p>
        </form>
        <div class="header-actions">
          <span class="sr-only" id="active-collection-label">Collection en cours</span>
          <div class="header-progress sr-only" id="progress-display" aria-live="polite">Chargement…</div>
        </div>
      </header>
      <div id="app-view-root">
        <section id="zythosphere-view" class="app-view app-view--zythosphere" data-app-view="zythosphere">
          <div id="carousel-container" role="region" aria-label="Carrousel de la collection"></div>
        </section>
        <section id="brassopedie-view" class="app-view app-view--brassopedie" data-app-view="brassopedie" hidden aria-label="Brassopédie"></section>
        <section id="degustation-view" class="app-view app-view-panel" data-app-view="degustation" hidden aria-label="Dégustation"><div class="app-view-panel-inner"><h1>Dégustation</h1><p>Chargement…</p></div></section>
        <section id="badges-view" class="app-view app-view-panel" data-app-view="badges" hidden><div class="app-view-panel-inner"><h1>Badges</h1><p>Chargement…</p></div></section>
        <section id="reglages-view" class="app-view app-view-panel" data-app-view="reglages" hidden><div class="app-view-panel-inner"><h1>Réglages</h1><p>Chargement…</p></div></section>
      </div>
    </div>

    <div id="reveal-overlay" aria-modal="true" role="dialog" aria-label="Révélation de carte" tabindex="-1" hidden>
      <div id="reveal-stage"></div>
      <div id="reveal-actions" hidden>
        <div class="reveal-message"><p class="reveal-headline" id="reveal-headline"></p><p class="reveal-sub">Carte ajoutée à la collection</p></div>
        <div class="reveal-btns"><button class="reveal-btn reveal-btn-primary" id="btn-continue">Continuer</button></div>
      </div>
    </div>
  </div>

  <div id="app-notice" class="app-notice" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
